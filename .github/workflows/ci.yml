# .github/workflows/ci.yml
name: CI Quality & Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs on the same branch/PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Execute Unified Quality Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for 'gitleaks detect' to scan full commit history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Gitleaks)
        run: |
          GITLEAKS_VERSION="8.18.2"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

      - name: Install Python Package & Security Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .[dev]

      - name: Make Scripts Executable
        run: chmod +x ./scripts/check-quality.sh

      - name: Run Quality Gate Script (CI Mode)
        run: ./scripts/check-quality.sh ci
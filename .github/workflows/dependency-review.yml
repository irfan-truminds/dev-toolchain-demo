# .github/workflows/dependency-review.yml
name: Dependency Review
on: [pull_request]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high # Fails PR if a dependency introduces high/critical CVEs
          deny-licenses: GPL-3.0, AGPL-3.0 # Optional: Block incompatible open-source licenses

name: Build & Deploy Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: read
  packages: write  # Needed for GHCR

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    outputs:
      # `meta.outputs.tags` is multi-line; `version` is the single primary tag.
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This step had never scanned anything. `steps.meta.outputs.tags` is
      # MULTI-LINE -- two tags here, `:main` and `:<sha>` -- and `image-ref`
      # takes one reference, so trivy died on
      #   could not parse reference: ghcr.io/.../dev-toolchain-demo:main
      #   ghcr.io/.../dev-toolchain-demo:45d5bd7
      # and the job went red for a parse error, not a vulnerability. Third
      # instance in this repo of the same species: a security gate that looked
      # like it was running and was not.
      #
      # Scan by DIGEST, not by tag: it is a single value by construction, and it
      # pins the scan to exactly the image this run pushed -- a tag can move
      # between the push and the scan.
      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0  # pinned; @master is not a version (tags carry the `v`)
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'          # fail the deploy on a finding -- this IS the gate
          severity: 'CRITICAL,HIGH'
          # Only block on CVEs somebody can actually act on. Base-image CVEs with
          # no upstream fix would hold the gate red forever, and a gate that is
          # always red is a gate people learn to ignore. The unfixed ones still
          # appear in the report; they just do not block.
          ignore-unfixed: true
          # The first honest run of this gate produced TWO FALSE POSITIVES, and
          # they are worth keeping the reason for. Trivy reads
          #   .../site-packages/pip/_vendor/vendor.txt
          #     msgpack==1.1.2
          #     setuptools==70.3.0
          # and reports those as installed packages. They are pip's own vendored
          # copies; the packages actually installed here are msgpack 1.2.2 and
          # setuptools 84.0.0, both already patched. Verified by reading the
          # image, not the report.
          #
          # This is the "three ways a gate is worse than having none" slide
          # happening to us: a gate that cries wolf gets switched off. Scoped
          # rather than silenced -- a .trivyignore of the two CVE ids would also
          # hide them when they are real somewhere else.
          skip-dirs: '**/pip/_vendor'

  deploy-prod:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: production # Triggers manual approval gates & loads prod secrets
    steps:
      - name: Deploy to Cloud
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:${{ needs.build-and-scan.outputs.image-tag }}"
          echo "  digest: ${{ needs.build-and-scan.outputs.image-digest }}"
          # Insert deployment commands (e.g., helm upgrade, kubectl set image, or cloud API)
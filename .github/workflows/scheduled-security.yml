name: Scheduled Security Audit

on:
  schedule:
    # Run every Monday at 02:00 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions:
  contents: read
  security-events: write # Required to upload SARIF security alerts

jobs:
  deep-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep scan requires full git history

      - name: Dependency Vulnerability Audit
        if: always()
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format sarif -o pip-audit-results.sarif || true

      - name: Upload Security Findings to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif

  gitleaks-scan:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 # Scans full Git history

        - name: Run Gitleaks CLI and Output SARIF
          run: |
            # Install Gitleaks binary
            GITLEAKS_VERSION="8.18.2"
            wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
            tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
            sudo mv gitleaks /usr/local/bin/
            
            # Execute scan and produce SARIF report (exit code 0 prevents pipeline failure before upload)
            gitleaks git --format sarif --report-path gitleaks-results.sarif || true

        - name: Upload Gitleaks Findings to GitHub Code Scanning
          uses: github/codeql-action/upload-sarif@v3
          if: always()
          with:
            sarif_file: gitleaks-results.sarif
